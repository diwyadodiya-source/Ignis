<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ignis: the football drill mat app. Precision with Passion.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ignis</title>
<meta name="theme-color" content="#0e1943">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: one mobile app column. On phones it fills the screen; on desktop it sits in a device frame beside the product story. */
:root{
  --navy:#0e1943; --navy-2:#0f1c4c; --royal:#213ea6; --royal-2:#1b3388; --title:#17296f;
  --ink:#1d1617; --grey:#7b6f72; --grey-2:#ada4a5; --field:#f7f8f8; --line:#dddadb;
  --lav:#d9dbea; --lav-2:#d2d8eb; --lav-3:#e8ebf8; --white:#ffffff; --heart:#ff1f1f;
  --cyan:#19f0ff; --cyan-dim:#0b5d68; --good:#3cc47c;
  --stage-a:#060a1c; --stage-b:#14246a;
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow-btn:0 10px 22px rgba(95,120,230,.28);
  --shadow-card:0 10px 40px rgba(29,22,23,.07);
  --grad-btn:linear-gradient(90deg,#213ea6 0%,#0f1c4c 100%);
  --grad-card:linear-gradient(180deg,#213ea6 17%,#0f1c4c 100%);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#eef0f8;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;justify-content:center;background:#eef0f8}
.pitch{display:none;color:#fff;max-width:400px;min-width:0}
.pitch h1{font-size:64px;line-height:1;margin:0;font-weight:800;letter-spacing:.02em}
.pitch .tag{font-size:18px;font-weight:300;opacity:.8;margin:10px 0 28px}
.pitch img{width:100%;border-radius:24px;display:block;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.pitch ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px}
.pitch li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;opacity:.85}
.pitch li span.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-top:7px;box-shadow:0 0 10px var(--cyan)}
.pitch .note{font-size:12px;opacity:.5;margin-top:22px}
.device{position:relative;width:100%;max-width:480px;height:100%;background:var(--white);overflow:hidden;box-shadow:0 0 60px rgba(14,25,67,.12)}
@media (max-width:560px){
  body{background:var(--white)}
  .stage{padding:0;display:block}
  .device{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* ---------- screens ---------- */
#app{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--white);scrollbar-width:none;
  animation:in .32s cubic-bezier(.2,.8,.2,1) both}
.screen::-webkit-scrollbar{display:none}
.screen.back{animation-name:inBack}
@keyframes in{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inBack{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.screen,.screen.back{animation:none}*{transition:none!important}}
.pad{padding:0 30px}
.top{display:flex;align-items:center;justify-content:space-between;padding:40px 30px 0;gap:12px}
.top h2{font-size:16px;font-weight:700;margin:0;color:var(--title);flex:1;text-align:center}
.top h2.ink{color:var(--ink)}
.navbtn{width:32px;height:32px;border-radius:8px;background:var(--field);display:grid;place-items:center;flex:none;color:var(--ink)}
.navbtn.ghost{background:rgba(255,255,255,.9)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:60px;border-radius:99px;
  font-weight:700;font-size:16px;color:#fff;background:var(--navy);box-shadow:var(--shadow-btn);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.grad{background:var(--grad-btn)}
.btn.grad-dark{background:linear-gradient(90deg,#213ea6,#000)}
.btn.grad-r{background:linear-gradient(90deg,#0f1c4c,#213ea6)}
.btn.white{background:#fff;color:#000;box-shadow:none}
.btn.small{height:40px;font-size:13px;width:auto;padding:0 22px}
.btn[disabled]{opacity:.45;pointer-events:none}
.cta{position:sticky;bottom:0;padding:24px 30px calc(24px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(255,255,255,0),#fff 32%);z-index:5;margin-top:auto}
.flexcol{min-height:100%;display:flex;flex-direction:column}

.h-title{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.h-sec{font-size:16px;font-weight:600;margin:0}
.muted{color:var(--grey);font-size:12px;line-height:1.55}
.link{color:var(--royal);font-weight:500}
.u{text-decoration:underline}

/* fields */
.field{display:flex;align-items:center;gap:10px;height:48px;border-radius:14px;background:var(--field);padding:0 15px;border:1px solid var(--field);color:var(--grey)}
.field:focus-within{border-color:var(--lav-2)}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:12px;color:var(--ink);height:100%;appearance:none}
.field input::placeholder{color:var(--grey-2)}
.field.err{border-color:#f2a3a3}
.unit{width:48px;height:48px;border-radius:14px;background:var(--navy);color:#fff;font-size:12px;font-weight:500;flex:none}
.err-text{color:#c0392b;font-size:11px;margin:-6px 0 0 4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:10px;color:var(--grey-2);line-height:1.5}
.check input{width:16px;height:16px;margin:0;flex:none;accent-color:var(--navy)}
.or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:flex;justify-content:center;gap:30px}
.social button{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center}

/* ---------- welcome ---------- */
.welcome{display:flex;flex-direction:column;min-height:100%;transition:background .8s}
.welcome .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:color .8s}
.welcome .mid h1{font-size:36px;font-weight:700;margin:0;letter-spacing:.01em}
.welcome .mid p{margin:0;font-size:18px;font-weight:400;opacity:.75}
.welcome.dark{background:linear-gradient(20deg,#325cf5 0%,#1c33a0 30%,#101f62 60%,#000 100%);color:#fff}
.welcome .cta{background:none}

/* ---------- onboarding ---------- */
.ob{min-height:100%;display:flex;flex-direction:column;touch-action:pan-y}
.ob img.hero{width:100%;display:block;aspect-ratio:750/860;object-fit:cover;object-position:top}
.ob .txt{padding:22px 30px 0}
.ob .txt h2{font-size:24px;font-weight:700;margin:0 0 15px}
.ob .txt p{font-size:14px;color:var(--grey);line-height:1.6;margin:0;max-width:315px}
.ob-next{position:absolute;right:30px;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:60px;height:60px;display:grid;place-items:center}
.ob-next svg.ring{position:absolute;inset:-5px;transform:rotate(-90deg)}
.ob-next .core{width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,#213ea6,#000);display:grid;place-items:center;color:#fff}
.ob-dots{position:absolute;left:30px;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.ob-dots i{width:6px;height:6px;border-radius:9px;background:var(--lav-2);transition:width .3s,background .3s}
.ob-dots i.on{width:20px;background:var(--royal)}

/* ---------- register / goal ---------- */
.illus{display:block;margin:30px auto 0;width:300px;max-width:80%}
.goal-wrap{position:relative;height:480px;margin:30px 0 0;touch-action:pan-y}
.goal-card{position:absolute;left:50%;top:0;width:275px;height:478px;margin-left:-137.5px;border-radius:22px;background:var(--grad-card);color:#fff;
  box-shadow:0 10px 22px rgba(197,139,242,.3);display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 30px 34px;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s}
.goal-card img{width:236px;height:270px;object-fit:contain}
.goal-card h3{font-size:14px;font-weight:600;margin:auto 0 0}
.goal-card hr{width:50px;border:0;border-top:1px solid #fff;margin:6px 0 20px}
.goal-card p{font-size:12px;margin:0;line-height:1.55;min-height:56px}
.goal-card.light{background:#fff;color:var(--ink);box-shadow:0 10px 22px rgba(0,0,0,.2)}
.goal-card.light hr{border-color:var(--ink)}
.blue-bg{background:linear-gradient(180deg,#213ea6 0%,#0e1944 100%);color:#fff}
.goal-dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.goal-dots i{width:6px;height:6px;border-radius:9px;background:var(--lav-2)}
.goal-dots i.on{background:var(--royal);width:18px}
.pair{display:flex;gap:16px;align-items:center}
.pair .ghostbtn{flex:1;height:60px;font-weight:700;font-size:16px;color:var(--navy)}
.pair .btn{flex:1.2}

/* ---------- home ---------- */
.home{padding-bottom:120px}
.hello{display:flex;justify-content:space-between;align-items:flex-start;padding:40px 30px 0}
.hello small{font-size:12px;color:var(--ink)}
.hello h1{font-size:20px;font-weight:700;color:var(--title);margin:2px 0 0}
.bell{width:40px;height:40px;border-radius:8px;background:var(--field);display:grid;place-items:center;position:relative;color:var(--ink)}
.bell b{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:#e54848;border:1.5px solid var(--field)}
.matpill{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;font-weight:500;padding:6px 12px 6px 8px;border-radius:99px;background:var(--lav-3);color:var(--title)}
.matpill i{width:8px;height:8px;border-radius:50%;background:var(--grey-2)}
.matpill.on{background:#0b1230;color:#bff9ff}
.matpill.on i{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.bmi{margin:30px 30px 0;height:146px;border-radius:22px;background:linear-gradient(135deg,#172a70 0%,#0e1943 100%);color:#fff;position:relative;overflow:hidden;padding:26px 20px;box-shadow:0 10px 22px rgba(23,41,111,.3)}
.bmi h3{font-size:14px;font-weight:600;margin:0}
.bmi p{font-size:12px;margin:5px 0 15px;opacity:.95}
.bmi .pie{position:absolute;right:20px;top:20px;width:106px;height:106px}
.bmi .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.btn-pill{height:35px;padding:0 20px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;font-size:10px;font-weight:600;position:relative;z-index:1}
.target{margin:30px 30px 0;height:57px;border-radius:16px;background:var(--lav);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.target span{font-size:14px;font-weight:500}
.chip{height:28px;padding:0 20px;border-radius:50px;background:#3b4b88;color:#fff;font-size:12px}
.card{background:#fff;border-radius:20px;box-shadow:var(--shadow-card)}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:30px 30px 15px}
.drop{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:50px;background:var(--navy);color:#fff;font-size:10px}
.hr-card{margin:0 30px;height:150px;border-radius:20px;background:linear-gradient(180deg,#fff,#f4f5fb);box-shadow:var(--shadow-card);position:relative;overflow:hidden;padding:20px}
.hr-card .lbl{font-size:12px;font-weight:500}
.hr-card .val{font-size:14px;font-weight:600;color:var(--royal-2);margin-top:5px}
.hr-card svg{position:absolute;left:0;bottom:0;width:100%;height:100px}
.hr-tip{position:absolute;padding:4px 10px;border-radius:50px;background:var(--navy);color:#fff;font-size:10px;transform:translate(-50%,-140%);white-space:nowrap;transition:left .6s,top .6s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:15px 30px 0}
.sched{grid-row:span 2;padding:20px 15px 20px 20px;display:flex;gap:12px;min-height:315px}
.sched .bar{width:20px;border-radius:30px;background:var(--field);position:relative;overflow:hidden;flex:none}
.sched .bar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#213ea6,#0f1c4c);border-radius:30px;transition:height .6s}
.sched h4{font-size:12px;font-weight:500;margin:0 0 30px;color:var(--title)}
.sched .rt{font-size:10px;color:var(--ink);margin-bottom:10px}
.sched ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.sched li{font-size:8.5px;color:var(--title);display:flex;gap:9px;align-items:flex-start;position:relative;padding-bottom:16px}
.sched li::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid #c58bf2;flex:none;margin-top:1px;background:#fff;position:relative;z-index:1}
.sched li.done::before{background:#5d6ccf;border-color:#5d6ccf}
.sched li:not(:last-child)::after{content:"";position:absolute;left:3px;top:9px;bottom:0;border-left:1px dashed #c9b4ef}
.sched li small{display:block;color:var(--grey-2);font-size:7.5px}
.mini{padding:20px;min-height:150px}
.mini h4{font-size:12px;font-weight:500;margin:0}
.mini .big{font-size:14px;font-weight:600;color:var(--title);margin-top:5px}
.ring{width:80px;height:80px;margin:8px auto 0;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--navy-2);color:#fff;font-size:8px;display:grid;place-items:center;text-align:center;line-height:1.3;box-shadow:0 4px 12px rgba(23,41,111,.35)}
.prog{margin:0 30px;position:relative}
.prog svg{display:block;width:100%;height:auto;overflow:visible}
.prog-tip{position:absolute;left:30%;top:0;background:#fff;border-radius:8px;box-shadow:0 10px 22px rgba(29,22,23,.1);padding:8px 10px;width:122px;font-size:8px;color:var(--grey-2)}
.prog-tip b{display:block;font-size:10px;font-weight:400;color:var(--ink);margin:4px 0 6px}
.prog-tip .pb{height:5px;border-radius:9px;background:var(--field);overflow:hidden}
.prog-tip .pb i{display:block;height:100%;background:#3b4b88}
.prog-tip em{position:absolute;right:10px;top:8px;color:#42d742;font-style:normal}
.drill-row{display:flex;align-items:center;gap:15px;padding:15px;margin:0 15px 15px;border-radius:16px;background:#fff;box-shadow:var(--shadow-card);width:calc(100% - 30px);text-align:left}
.av{width:50px;height:50px;border-radius:50%;background:var(--lav-3);flex:none;overflow:hidden;display:grid;place-items:center}
.av img{width:100%;height:100%;object-fit:cover}
.drill-row .meta{flex:1;min-width:0}
.drill-row b{font-size:12px;font-weight:500;color:var(--title);display:block}
.drill-row small{font-size:10px;color:var(--grey-2)}
.pbar{height:10px;border-radius:9px;background:var(--field);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:#3b4b88;border-radius:9px}
.circ{width:24px;height:24px;border-radius:50%;border:1px solid var(--title);flex:none;display:grid;place-items:center;color:#fff;transition:background .2s}
.circ.on{background:var(--title)}

/* ---------- bottom nav ---------- */
.bnav{position:absolute;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;
  box-shadow:0 -10px 40px rgba(29,22,23,.07);display:flex;align-items:center;justify-content:space-around;z-index:20}
.bnav button{width:48px;height:48px;display:grid;place-items:center;color:var(--grey-2);position:relative}
.bnav button.on{color:var(--title)}
.bnav button.on::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--title)}
.bnav .fab{width:60px;height:60px;border-radius:50%;background:var(--navy-2);color:#fff;margin-top:-34px;box-shadow:0 10px 22px rgba(23,41,111,.35)}
.bnav .fab::after{display:none}

/* ---------- lists ---------- */
.notif{display:flex;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}
.notif .av{width:40px;height:40px}
.notif b{font-size:12px;font-weight:500;color:var(--title);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif.read b{color:var(--grey)}
.notif small{font-size:10px;color:var(--grey)}
.notif .meta{flex:1;min-width:0}
.dots-v{width:24px;height:24px;color:var(--grey-2);display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--grey-2);font-size:12px;padding:60px 20px}

/* tracker */
.tt{margin:30px 30px 0;border-radius:22px;background:#f2f4fb;padding:20px}
.tt-head{display:flex;justify-content:space-between;align-items:center}
.tt-head b{font-size:14px;font-weight:600}
.sq{width:24px;height:24px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center}
.tt-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
.tt-grid div{background:#fff;border-radius:12px;height:60px;display:flex;align-items:center;gap:8px;padding:0 10px}
.tt-grid img{width:32px;height:40px;object-fit:contain}
.tt-grid b{font-size:12px;font-weight:500;color:var(--title);display:block}
.tt-grid small{font-size:10px;color:var(--grey)}
.bars{margin:0 30px;padding:20px 18px 18px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.bars .col{display:flex;flex-direction:column;align-items:center;gap:8px}
.bars .track{width:22px;height:135px;border-radius:30px;background:var(--field);position:relative;overflow:hidden}
.bars .track i{position:absolute;left:0;right:0;bottom:0;border-radius:30px;background:#14215a;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.bars .col:nth-child(odd) .track i{background:linear-gradient(180deg,#213ea6,#14215a)}
.bars .col.today .track{box-shadow:0 0 0 1.5px var(--lav-2)}
.bars span{font-size:10px;color:var(--grey)}
.bars .col.today span{color:var(--title);font-weight:600}
.fav{margin:0 30px;position:relative;padding-bottom:30px}
.fav .card{padding:20px;position:relative;z-index:2;box-shadow:0 4px 8px rgba(0,0,0,.18)}
.fav .card b{font-size:12px;font-weight:500;color:var(--title)}
.fav .card small{display:block;font-size:10px;color:var(--grey-2);margin-top:4px}
.fav .under{position:absolute;left:0;right:0;top:46px;height:76px;border-radius:20px;background:#fff;box-shadow:var(--shadow-card);filter:blur(1.5px);z-index:1}

/* today target */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 30px 0}
.dcard{border-radius:20px;background:var(--lav);height:150px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;transition:filter .3s,box-shadow .3s,transform .2s;position:relative}
.dcard b{font-size:10px;font-weight:400;color:var(--ink)}
.dcard img{width:100%;margin-top:auto;object-fit:contain}
.dcard.off{filter:blur(4px);opacity:.85}
.dcard.on{box-shadow:0 4px 6px rgba(0,0,0,.25)}
.addfab{width:60px;height:60px;border-radius:50%;background:#2b3fa0;color:#fff;align-self:center;justify-self:center;box-shadow:0 8px 16px rgba(43,63,160,.35);display:grid;place-items:center}

/* rooms */
.room{margin:0 30px 30px;padding:15px 16px 20px;border-radius:15px;background:#fff;box-shadow:var(--shadow-card);position:relative}
.room h3{font-size:20px;font-weight:400;margin:0;color:var(--title)}
.room em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--royal);margin:-2px 0 0 2px}
.room p{font-size:11px;color:var(--title);margin:18px 0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .dots-h{position:absolute;right:14px;top:12px;color:#3e005c}
.room-fab{width:60px;height:60px;border-radius:50%;background:#f5f5f5;box-shadow:0 4px 10px rgba(0,0,0,.18);display:grid;place-items:center;margin:auto auto 0;color:var(--grey)}

/* profile */
.pf{display:flex;align-items:center;gap:15px;margin:35px 30px 0}
.pf .av{width:55px;height:55px}
.pf .meta{flex:1;min-width:0}
.pf b{font-size:14px;font-weight:500;color:var(--title);display:block}
.pf small{font-size:12px;color:var(--grey)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:15px 30px 0}
.stats div{background:#fff;border-radius:16px;box-shadow:var(--shadow-card);padding:12px 6px;text-align:center}
.stats b{display:block;font-size:14px;font-weight:500;color:var(--title)}
.stats small{font-size:12px;color:var(--grey)}
.pcard{margin:30px 30px 0;padding:20px;border-radius:16px;background:#fff;box-shadow:var(--shadow-card)}
.pcard+.pcard{margin-top:15px}
.pcard h3{font-size:16px;font-weight:600;margin:0 0 10px;color:var(--title)}
.prow{display:flex;align-items:center;gap:10px;width:100%;height:30px;font-size:12px;color:var(--grey);text-align:left}
.prow svg:first-child{color:#8197f5}
.prow span{flex:1}
.toggle{width:36px;height:18px;border-radius:99px;background:var(--lav-2);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--grad-btn)}
.toggle.on::after{transform:translateX(18px)}

/* personalisation */
.month{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:30px;color:var(--grey-2);font-size:14px}
.dates{display:flex;gap:15px;margin-top:15px;padding:0 0 4px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-left:30px;padding-right:30px}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:60px;height:80px;border-radius:10px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--grey);scroll-snap-align:center;position:relative}
.date span{font-size:12px}
.date b{font-size:14px;font-weight:500}
.date.on{background:linear-gradient(180deg,#4a5ba6,#2d3b7a);color:#fff}
.date .has{position:absolute;bottom:7px;width:4px;height:4px;border-radius:50%;background:var(--royal)}
.date.on .has{background:#fff}
.sel{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:10px;text-align:left}
.sel .tile{width:60px;height:60px;border-radius:14px;background:var(--lav-2);flex:none;display:grid;place-items:center;color:var(--title)}
.sel .name{flex:1;font-size:14px;font-weight:500;align-self:flex-start;margin-top:9px}
.sel .name small{display:block;font-size:10px;color:var(--grey-2);font-weight:400}
.radio{width:20px;height:20px;border-radius:50%;border:1px solid var(--grey);flex:none;display:grid;place-items:center;color:#fff;transition:background .2s,border-color .2s}
.radio.on{background:var(--title);border-color:var(--title)}

/* workout plan */
.wk-hero{height:418px;background:#4a60ac;position:relative;overflow:hidden}
.wk-hero .circle{position:absolute;left:42px;top:112px;width:288px;height:265px;border-radius:50%;background:#41549c}
.wk-hero img{position:absolute;left:58px;top:48px;width:275px;height:295px;object-fit:contain}
.wk-hero .navbtn{position:absolute;top:40px;z-index:2;background:#fff}
.wk-sheet{background:#fff;border-radius:40px 40px 0 0;margin-top:-72px;position:relative;padding-top:10px;min-height:400px}
.handle{width:50px;height:5px;border-radius:50px;background:var(--lav-2);margin:0 auto 35px}
.wk-title{display:flex;justify-content:space-between;align-items:center}
.wk-title b{font-size:16px;font-weight:700;display:block}
.wk-title small{font-size:12px;color:var(--grey)}
.hearter{width:32px;height:32px;border-radius:8px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);display:grid;place-items:center;color:var(--grey-2)}
.hearter.on{color:var(--heart)}
.lrow{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--lav-2);padding:0 15px;font-size:12px;color:var(--grey);width:100%;margin-top:15px;text-align:left}
.lrow span{flex:1}
.lrow em{font-style:normal;font-size:10px}
.set{font-size:12px;font-weight:500;margin:22px 0 10px}
.ex{display:flex;align-items:center;gap:15px;width:100%;padding:6px 0;text-align:left}
.ex .tile{width:60px;height:60px;border-radius:12px;background:#f5f6fa;display:grid;place-items:center;color:var(--royal-2);flex:none}
.ex .meta{flex:1}
.ex b{font-size:14px;font-weight:500;display:block}
.ex small{font-size:12px;color:var(--grey)}
.ex .go{color:var(--grey-2)}

/* drill detail */
.video{margin:0 28px;height:150px;border-radius:22px;overflow:hidden;position:relative;background:#1d2b63}
.video img{width:100%;height:100%;object-fit:cover;display:block}
.video svg.mat{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .4s;background:#0a0f26}
.video.playing svg.mat{opacity:1}
.video .vbtn{position:absolute;inset:0;display:grid;place-items:center}
.steps{list-style:none;margin:15px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:27px 20px 1fr;gap:0 15px;position:relative;padding-bottom:16px}
.steps .n{font-size:14px;color:var(--lav-2);color:#9aa3d6}
.steps .c{width:20px;height:20px;border-radius:50%;border:1px solid #9aa3d6;display:grid;place-items:center}
.steps .c i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#92a3fd,#4a5ba6)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:51px;top:24px;bottom:2px;border-left:1px dashed #b8bfe6}
.steps b{font-size:14px;font-weight:400;display:block}
.steps p{font-size:12px;color:var(--grey);line-height:1.5;margin:5px 0 0}
.wheel{height:150px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;margin-top:15px;
  mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel-wrap{position:relative}
.wheel-wrap::before,.wheel-wrap::after{content:"";position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.wheel-wrap::before{top:62px}.wheel-wrap::after{top:108px}
.wheel .pad-y{height:52px}
.wheel .opt{height:46px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--grey-2);font-size:10px;transition:color .2s}
.wheel .opt b{font-size:18px;font-weight:400;min-width:30px}
.wheel .opt.on{color:var(--grey)}
.wheel .opt.on b{font-size:30px;color:var(--grey)}
.wheel .opt .fl{color:#f99}
.wheel .opt.on .fl{color:#f33}

/* live session */
.live{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a1235 0%,#0e1943 55%,#fff 55.1%)}
.live .top h2{color:#fff}
.live-head{color:#fff;text-align:center;margin-top:22px}
.live-head small{font-size:12px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.live-head h3{font-size:22px;font-weight:700;margin:4px 0 0}
.matbox{margin:22px 22px 0;border-radius:26px;background:#060917;box-shadow:0 20px 40px rgba(0,0,0,.4),inset 0 0 0 1px #1d2550;padding:14px;position:relative}
.matbox svg{display:block;width:100%;height:auto}
.zone{cursor:pointer;color:var(--cyan-dim);transition:color .12s,filter .12s}
.zone.lit{color:var(--cyan);filter:url(#glow)}
.zone.hit{color:#7dffb0;filter:url(#glow)}
.mat-hint{position:absolute;left:0;right:0;bottom:-28px;text-align:center;font-size:11px;color:var(--grey)}
.live-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:48px 30px 0}
.live-stats div{background:var(--field);border-radius:16px;padding:12px 6px;text-align:center}
.live-stats b{display:block;font-size:20px;font-weight:600;color:var(--title);font-variant-numeric:tabular-nums}
.live-stats small{font-size:10px;color:var(--grey)}
.timer-bar{margin:18px 30px 0;height:8px;border-radius:9px;background:var(--field);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--grad-btn);border-radius:9px;transition:width 1s linear}
.live-next{margin:12px 30px 0;font-size:12px;color:var(--grey);display:flex;justify-content:space-between}
.live-ctrl{display:flex;gap:12px}
.live-ctrl .btn{flex:1}
.live-ctrl .sq-btn{width:60px;height:60px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--title);flex:none}

/* sheet + toast */
#sheet-root{position:absolute;inset:0;pointer-events:none;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(14,25,67,.38);opacity:0;transition:opacity .25s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:10px 30px calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:auto;max-height:86%;overflow-y:auto}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:none}
.sheet h3{font-size:18px;font-weight:700;margin:0 0 6px}
.sheet .stack{display:grid;gap:12px;margin-top:16px}
.opt-row{display:flex;align-items:center;gap:12px;height:50px;border-radius:14px;background:var(--field);padding:0 15px;font-size:13px;width:100%;text-align:left}
.opt-row.on{background:var(--lav);color:var(--title);font-weight:500}
.opt-row span{flex:1}
.mat-hero{width:100%;border-radius:20px;display:block;margin-top:12px;aspect-ratio:1280/860;object-fit:cover}
.status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--grey);margin-top:14px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--grey-2)}
.status.on i{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--lav-2);border-top-color:var(--royal);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--navy);color:#fff;font-size:12px;padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:60;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.example{font-size:10px;color:var(--grey-2);text-align:center;margin-top:8px}
</style>

</head>

const app=document.getElementById('app');
let stack=[],cur=null,timers=[];
function clearTimers(){timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]}
function go(name,params={},opts={}){
  clearTimers();closeSheet(true);
  if(opts.replace)stack.pop();
  if(!opts.back&&cur&&!opts.reset)stack.push(cur);
  if(opts.reset)stack=[];
  cur={name,params};
  const html=SCREENS[name](params);
  const el=document.createElement('div');
  el.className='screen'+(opts.back?' back':'');
  el.innerHTML=html;
  app.innerHTML='';app.appendChild(el);
  if(NAVS.includes(name))app.insertAdjacentHTML('beforeend',bnav(name));
  (AFTER[name]||(()=>{}))(el,params);
  save();
}
function back(){const p=stack.pop();if(p){go(p.name,p.params,{back:true})}else go('home',{}, {reset:true,back:true})}

function bnav(active){
  const b=(n,i,lbl,iOn)=>`<button data-go="${n}" class="${active===n?'on':''}" aria-label="${lbl}">${ic(active===n&&iOn?iOn:i,24)}</button>`;
  return `<nav class="bnav" aria-label="Main">${b('home','home','Home','homeF')}${b('tracker','activity','Activity tracker')}<button class="fab" data-act="search" aria-label="Search drills">${ic('search',24,1.8)}</button>${b('rooms','rooms','Rooms')}${b('profile','user','Profile','profileF')}</nav>`;
}

  const b=e.target.closest('[data-back]');if(b){back();return}

function wedge(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1} Z`}

  const draw=()=>{const n=pts.length;const step=315/(n-1);const cut=Math.round(n*0.62);
    const line=pts.map((v,k)=>`${(k*step).toFixed(1)},${(100-v).toFixed(1)}`);
    svg.innerHTML=`<defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa3d6" stop-opacity=".55"/><stop offset="1" stop-color="#9aa3d6" stop-opacity="0"/></linearGradient></defs>
     <path d="M0,100 L${line.slice(0,cut+1).join(' L')} L${(cut*step).toFixed(1)},100Z" fill="url(#hg)"/>
     <polyline points="${line.slice(0,cut+1).join(' ')}" fill="none" stroke="#9aa3d6" stroke-width="1.2"/>
     <polyline points="${line.slice(cut).join(' ')}" fill="none" stroke="#e3e5f3" stroke-width="1.2"/>

    tip.style.left=(cut*step/315*box.width)+'px';tip.style.top=(box.top-par.top+(100-pts[cut])/100*box.height)+'px';};

  if(S.mat.connected){tip.textContent='live';timers.push(setInterval(()=>{bpm=Math.max(68,Math.min(132,bpm+Math.round((Math.random()-.4)*6)));bpmEl.textContent=bpm+' BPM';pts.shift();pts.push(30+Math.random()*40);draw()},1500))}

function drawProgress(host){
  const days=last7();const W=315,H=170,x0=0,x1=272,y0=12,y1=130;const sx=k=>x0+12+k*(x1-24)/6;const sy=p=>y1-(p/100)*(y1-y0);
  const val=days.map(d=>Math.min(100,Math.round(d.minutes/40*100)));const goal=days.map((d,k)=>45+Math.round(Math.sin(k*1.3+1)*30+20));
  const smooth=arr=>arr.map((v,k)=>{const x=sx(k),y=sy(v);if(!k)return `M${x} ${y}`;const px=sx(k-1),py=sy(arr[k-1]);const cx=(px+x)/2;return `C${cx} ${py} ${cx} ${y} ${x} ${y}`}).join(' ');
  const ti=6;const bx=sx(ti)-9;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" aria-label="Weekly drill completion">
   <defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#213ea6"/><stop offset="1" stop-color="#9aa3d6" stop-opacity=".6"/></linearGradient></defs>
   ${[0,20,40,60,80,100].map(p=>`<line x1="0" x2="${x1}" y1="${sy(p)}" y2="${sy(p)}" stroke="#f0f0f3"/><text x="${W}" y="${sy(p)+4}" text-anchor="end" font-size="10" fill="${p===val[ti]?'#17296f':'#7b6f72'}" font-family="Poppins">${p}%</text>`).join('')}
   <rect x="${bx}" y="${sy(Math.max(val[ti],8))}" width="18" height="${y1-sy(Math.max(val[ti],8))}" fill="url(#bg2)" rx="2"/>
   <path d="${smooth(goal)}" fill="none" stroke="#e1e3f1" stroke-width="2"/>
   <path d="${smooth(val)}" fill="none" stroke="#9aa3d6" stroke-width="2"/>
   ${days.map((d,k)=>`<text x="${sx(k)}" y="${H-12}" text-anchor="middle" font-size="12" fill="${k===ti?'#17296f':'#7b6f72'}" font-weight="${k===ti?600:400}" font-family="Poppins">${WD[d.d.getDay()]}</text>`).join('')}
  </svg>`;
  const lastH=[...S.history].reverse()[0];
  if(lastH){const dd=new Date(lastH.date+'T12:00');const pc=Math.min(100,Math.round(lastH.minutes/40*100));
   host.insertAdjacentHTML('beforeend',`<div class="prog-tip"><em>${pc}% ↑</em>${WD[dd.getDay()]}, ${dd.getDate()} ${MON[dd.getMonth()].slice(0,3).toLowerCase()}<b>${esc(D(planFor(lastH.date)[0]||'ball-shift').name)}</b><div class="pb"><i style="width:${pc}%"></i></div></div>`)}
}

ACTS.tAdd=()=>{const left=DRILLS.filter(d=>!S.today.includes(d.id));openSheet(`<h3>Add a drill</h3><div class="stack">${left.map(d=>`<button class="opt-row" data-act="tAddOne" data-id="${d.id}"><span>${esc(d.name)}</span><small class="muted">${d.secs}s</small></button>`).join('')||'<p class="muted">Every drill is already on your board.</p>'}</div>`)};
ACTS.tAddOne=a=>{S.today.push(a.dataset.id);S.todayOn.push(a.dataset.id);closeSheet(true);rerender()};
ACTS.tDone=()=>{const p=planFor(TODAY);S.plan[TODAY]=p.concat(S.todayOn.filter(x=>!p.includes(x)));toast(S.todayOn.length+' target drills added to today');go('home',{},{reset:true,back:true})};

/* ---------- rooms ---------- */
SCREENS.rooms=()=>`<div class="flexcol" style="padding-bottom:110px">${top('Rooms')}<div style="margin-top:30px">
 ${S.rooms.map((r,k)=>`<div class="room"><button class="dots-h" data-act="roomMenu" data-k="${k}" aria-label="Room options">${ic('more',20)}</button><h3>${esc(r.name)}</h3><em>${esc(r.tag)}</em><p>${esc(r.members)}</p></div>`).join('')||'<p class="empty">No rooms yet. Create one to train with friends.</p>'}</div>
 <button class="room-fab" data-act="roomNew" aria-label="Create room">${ic('roomAdd',28,1.4)}</button>
 <div class="pad" style="margin-top:28px"><button class="btn" data-act="roomNew">Add friends</button></div></div>`;
ACTS.roomNew=()=>openSheet(`<h3>New room</h3><p class="muted">Rooms let friends see each other’s drills and compare progress.</p><form id="rf" class="stack"><label class="field"><input id="rm-name" placeholder="Room name" required></label><label class="field"><input id="rm-tag" placeholder="Group (team, family, college)"></label><label class="field"><input id="rm-mem" placeholder="Friends, separated by commas"></label><button class="btn" type="submit">Create room</button></form>`,sh=>{
  sh.querySelector('#rf').addEventListener('submit',e=>{e.preventDefault();const n=sh.querySelector('#rm-name').value.trim()||('Room '+(S.rooms.length+1));
   S.rooms.push({name:n,tag:sh.querySelector('#rm-tag').value.trim()||'Friends',members:sh.querySelector('#rm-mem').value.trim()||'Invite pending'});closeSheet(true);rerender();toast('Room created')})});
ACTS.roomMenu=a=>{const k=+a.dataset.k;openSheet(`<h3>${esc(S.rooms[k].name)}</h3><div class="stack"><button class="opt-row" data-act="roomInvite" data-k="${k}"><span>Invite friends</span>${ic('plus',16)}</button><button class="opt-row" data-act="roomLeave" data-k="${k}"><span>Leave room</span>${ic('logout',16)}</button></div>`)};
ACTS.roomInvite=a=>{const k=+a.dataset.k;openSheet(`<h3>Invite to ${esc(S.rooms[k].name)}</h3><form id="if" class="stack"><label class="field"><input id="inv" placeholder="Friend’s name" required></label><button class="btn" type="submit">Add</button></form>`,sh=>sh.querySelector('#if').addEventListener('submit',e=>{e.preventDefault();const v=sh.querySelector('#inv').value.trim();if(v){S.rooms[k].members=(S.rooms[k].members==='Invite pending'?'':S.rooms[k].members+', ')+v}closeSheet(true);rerender();toast(v+' added')}))};
ACTS.roomLeave=a=>{S.rooms.splice(+a.dataset.k,1);closeSheet(true);rerender();toast('You left the room')};

/* ---------- profile ---------- */
SCREENS.profile=()=>{const g=GOALS[S.goal];return `<div style="padding-bottom:120px">${top('Profile')}
 <div class="pf"><span class="av"><img src="av-profile.png" alt=""></span><div class="meta"><b>${esc(fullName())}</b><small>${g.focus[0].toUpperCase()+g.focus.slice(1)} focused</small></div><button class="btn small" data-act="editProfile" style="height:32px;font-size:12px;font-weight:400">Edit</button></div>
 <div class="stats"><div><b>${S.user.height}${S.user.hUnit}</b><small>Height</small></div><div><b>${S.user.weight}${S.user.wUnit}</b><small>Weight</small></div><div><b>${age()} y/o</b><small>Age</small></div></div>
 <div class="pcard"><h3>Account</h3>
  ${[['user','Personal Data','editProfile'],['doc','Achievement','achieve'],['pie','Activity History','toTracker'],['chart','Progress Chart','toTracker']].map(r=>`<button class="prow" data-act="${r[2]}">${ic(r[0],18)}<span>${r[1]}</span>${ic('right',16)}</button>`).join('')}</div>
 <div class="pcard"><h3>Notification</h3><div class="prow">${ic('bell',18)}<span>Pop-up Notification</span><button class="toggle ${S.popup?'on':''}" data-act="popup" role="switch" aria-checked="${S.popup}" aria-label="Pop-up Notification"></button></div></div>
 <div class="pcard"><h3>Other</h3>
  ${[['mail','Contact Us','contact'],['shield','Privacy Policy','privacy'],['gear','Settings','settings']].map(r=>`<button class="prow" data-act="${r[2]}">${ic(r[0],18)}<span>${r[1]}</span>${ic('right',16)}</button>`).join('')}</div></div>`};
ACTS.popup=a=>{S.popup=!S.popup;a.classList.toggle('on',S.popup);a.setAttribute('aria-checked',S.popup);save();toast(S.popup?'Pop-up notifications on':'Pop-up notifications off')};
ACTS.toTracker=()=>go('tracker',{},{reset:true});
ACTS.achieve=()=>{const total=S.history.reduce((s,h)=>s+h.minutes,0);const sessions=S.history.filter(h=>!h.example).length;const best=Math.min(...S.history.map(h=>h.reaction||999));
 openSheet(`<h3>Achievements</h3><div class="stack"><div class="opt-row"><span>Minutes trained</span><b>${total}</b></div><div class="opt-row"><span>Sessions with Ignis</span><b>${sessions}</b></div><div class="opt-row"><span>Fastest average reaction</span><b>${best} ms</b></div><div class="opt-row"><span>Goal</span><b>${GOALS[S.goal].title}</b></div></div>`)};
ACTS.contact=()=>openSheet(`<h3>Contact Us</h3><p class="muted">Write to the Ignis team and we’ll get back within two working days.</p><div class="stack"><div class="opt-row" style="user-select:all"><span>support@ignis.app</span></div><button class="btn" data-act="copyMail">Copy email address</button></div>`);
ACTS.copyMail=()=>{navigator.clipboard&&navigator.clipboard.writeText('support@ignis.app').then(()=>toast('Email address copied'),()=>toast('Select the address to copy it'))};
ACTS.privacy=()=>openSheet(`<h3>Privacy Policy</h3><p class="muted">Ignis stores your profile, drill plans and mat touch data to show your progress. In this preview everything stays in this browser on this device. Nothing is sent anywhere.</p>`);
ACTS.settings=()=>openSheet(`<h3>Settings</h3><div class="stack"><button class="opt-row" data-act="mat"><span>Ignis mat</span>${ic('mat',18)}</button><button class="opt-row" data-act="goalChange"><span>Change goal</span>${ic('right',16)}</button><button class="opt-row" data-act="reset"><span>Reset app and start over</span>${ic('logout',16)}</button></div>`);
ACTS.goalChange=()=>{closeSheet(true);go('goal',{i:Math.max(0,GK.indexOf(S.goal))})};
ACTS.reset=()=>openSheet(`<h3>Start over?</h3><p class="muted">This clears your profile, plans and history on this device.</p><div class="stack"><button class="btn" data-act="resetYes">Reset everything</button><button class="opt-row" data-act="closeSheet"><span>Keep my data</span></button></div>`);
ACTS.resetYes=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();closeSheet(true);go('welcome',{},{reset:true})};
ACTS.editProfile=()=>{const u=S.user;openSheet(`<h3>Personal Data</h3><form id="ef" class="stack">
 <label class="field">${ic('user',18)}<input id="e-first" value="${esc(u.first)}" placeholder="First Name"></label>
 <label class="field">${ic('user',18)}<input id="e-last" value="${esc(u.last)}" placeholder="Last Name"></label>
 <label class="field">${ic('cal',18)}<input id="e-dob" type="date" value="${u.dob}"></label>
 <div class="pair" style="gap:12px"><label class="field" style="flex:1">${ic('weight',18)}<input id="e-w" type="number" value="${u.weight}" aria-label="Weight"></label><span class="unit" style="display:grid;place-items:center">${u.wUnit.toUpperCase()}</span></div>
 <div class="pair" style="gap:12px"><label class="field" style="flex:1">${ic('height',18)}<input id="e-h" type="number" value="${u.height}" aria-label="Height"></label><span class="unit" style="display:grid;place-items:center">${u.hUnit.toUpperCase()}</span></div>
 <button class="btn" type="submit">Save</button></form>`,sh=>sh.querySelector('#ef').addEventListener('submit',e=>{e.preventDefault();const q=s=>sh.querySelector(s).value;
  S.user.first=q('#e-first').trim()||S.user.first;S.user.last=q('#e-last').trim();S.user.dob=q('#e-dob')||S.user.dob;S.user.weight=+q('#e-w')||S.user.weight;S.user.height=+q('#e-h')||S.user.height;closeSheet(true);rerender();toast('Profile saved')}))};

/* ---------- search ---------- */
ACTS.search=()=>openSheet(`<h3>Find a drill</h3><label class="field" style="margin-top:12px">${ic('search',18)}<input id="sq" placeholder="Search drills, like cuts or sole" autocomplete="off"></label><div class="stack" id="sres"></div>`,sh=>{
  const inp=sh.querySelector('#sq'),res=sh.querySelector('#sres');const draw=()=>{const q=inp.value.toLowerCase().trim();const l=DRILLS.filter(d=>!q||(d.name+' '+d.desc).toLowerCase().includes(q));
   res.innerHTML=l.map(d=>`<button class="opt-row" data-go="drill" data-p='{"id":"${d.id}"}'><span>${esc(d.name)}</span><small class="muted">${d.level} · ${d.secs}s</small></button>`).join('')||'<p class="muted">No drills match that search.</p>'};
  inp.addEventListener('input',draw);draw();setTimeout(()=>inp.focus(),300)});

/* ---------- personalisation ---------- */
SCREENS.personalise=({date=TODAY,mode='Day'})=>{const sel=new Date(date+'T12:00');const days=[];for(let k=-3;k<=3;k++)days.push(addDays(sel,k));
 const chosen=planFor(date);const list=DRILLS.filter(d=>d.id!=='dribbling');
 return `<div class="flexcol">${top('Personalisation',{ink:true,two:true})}
 <div class="pad" style="display:flex;justify-content:space-between;align-items:center;margin-top:30px"><h2 class="h-sec">Customize your Drill</h2><button class="drop" data-act="pMode" style="width:76px;justify-content:space-between">${mode} ${ic('down',14,1.8)}</button></div>
 <div class="month"><button data-act="pShift" data-n="-7" aria-label="Previous week">${ic('left',20,1.6)}</button><span>${MON[sel.getMonth()]} ${sel.getFullYear()}</span><button data-act="pShift" data-n="7" aria-label="Next week">${ic('right',20,1.6)}</button></div>
 <div class="dates" id="dates">${days.map(d=>{const k=ymd(d);return `<button class="date ${k===date?'on':''}" data-act="pDate" data-d="${k}" aria-pressed="${k===date}"><span>${WD[d.getDay()]}</span><b>${d.getDate()}</b>${planFor(k).length?'<i class="has"></i>':''}</button>`}).join('')}</div>
 <div class="pad" style="margin-top:30px"><h2 class="h-sec" style="margin-bottom:15px">Select <small class="muted" style="font-weight:400">${chosen.length} chosen · ~${minutesFor(chosen)} mins</small></h2>
  ${list.map(d=>{const on=chosen.includes(d.id);return `<div class="sel"><button class="tile" data-go="drill" data-p='{"id":"${d.id}"}' aria-label="About ${esc(d.name)}">${ic('bolt',20,1.4)}</button><button class="name" data-go="drill" data-p='{"id":"${d.id}"}' style="text-align:left">${esc(d.short)}<small>${d.secs} secs · ${d.level}</small></button><button class="radio ${on?'on':''}" data-act="pPick" data-id="${d.id}" role="checkbox" aria-checked="${on}" aria-label="Select ${esc(d.name)}" style="margin-top:20px">${on?ic('check',12,2.4):''}</button></div>`}).join('')}
 </div>
 <div class="cta"><button class="btn" data-act="pSave">Save</button></div></div>`};
AFTER.personalise=el=>{const d=el.querySelector('.date.on');d&&d.scrollIntoView({inline:'center',block:'nearest'})};
let pDraft=null;
ACTS.pDate=a=>go('personalise',{...cur.params,date:a.dataset.d},{replace:true});
ACTS.pShift=a=>{const d=addDays(new Date((cur.params.date||TODAY)+'T12:00'),+a.dataset.n);go('personalise',{...cur.params,date:ymd(d)},{replace:true})};
ACTS.pMode=()=>go('personalise',{...cur.params,mode:(cur.params.mode||'Day')==='Day'?'Week':'Day'},{replace:true});
ACTS.pPick=a=>{const date=cur.params.date||TODAY;const l=planFor(date).slice();const id=a.dataset.id;const i=l.indexOf(id);if(i>=0)l.splice(i,1);else l.push(id);S.plan[date]=l;
  const on=i<0;a.classList.toggle('on',on);a.setAttribute('aria-checked',on);a.innerHTML=on?ic('check',12,2.4):'';const sm=document.querySelector('.h-sec small');if(sm)sm.textContent=`${l.length} chosen · ~${minutesFor(l)} mins`;save()};
ACTS.pSave=()=>{const date=cur.params.date||TODAY;const l=planFor(date);if(!l.length){toast('Pick at least one drill');return}
  if((cur.params.mode||'Day')==='Week'){const s=new Date(date+'T12:00');for(let k=0;k<7;k++)S.plan[ymd(addDays(s,k))]=l.slice();toast('Plan saved for the next 7 days')}else toast('Plan saved');
  go('workout',{date},{replace:true})};

/* ---------- workout plan ---------- */
SCREENS.workout=({date=TODAY})=>{const d=new Date(date+'T12:00');const l=planFor(date);const sets=[];for(let k=0;k<l.length;k+=5)sets.push(l.slice(k,k+5));
 return `<div class="flexcol"><div class="wk-hero"><span class="circle"></span><img src="goal-reflex.png" alt="">
  <button class="navbtn" style="left:30px" data-back aria-label="Back">${ic('left',16,1.8)}</button><button class="navbtn" style="right:30px" data-act="more" aria-label="More">${ic('two',18)}</button></div>
 <div class="wk-sheet"><div class="handle"></div><div class="pad">
  <div class="wk-title"><div><b>${WDL[d.getDay()]}</b><small>${l.length} Exercises | ${minutesFor(l)}mins</small></div><button class="hearter ${S.favorite?'on':''}" data-act="fav" aria-pressed="${S.favorite}" aria-label="Favorite this plan">${ic('heart',16)}</button></div>
  <button class="lrow" data-act="schedule" style="margin-top:20px">${ic('cal',22,1.4)}<span>Schedule Workout</span><em>${fmtTime(S.schedule)}</em>${ic('right',16)}</button>
  <button class="lrow" data-act="difficulty">${ic('swap',22,1.4)}<span>Difficulity</span><em>${S.difficulty}</em>${ic('right',16)}</button>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:35px"><h2 class="h-sec">Exercises</h2><small class="muted">${sets.length} Set${sets.length===1?'':'s'}</small></div>
  ${sets.map((s,k)=>`<div class="set">Set ${k+1}</div>${s.map(id=>{const x=D(id);return `<button class="ex" data-go="drill" data-p='{"id":"${id}"}'><span class="tile">${ic('bolt',20,1.4)}</span><span class="meta"><b>${esc(x.name)}</b><small>${x.secs} secs${S.reps[id]?' · '+S.reps[id]+' reps':''}</small></span><span class="go">${ic('right',18)}</span></button>`}).join('')}`).join('')||'<p class="muted" style="margin-top:12px">No drills planned for this day. Add some in your drill plan.</p>'}
 </div>
 <div class="cta">${l.length?`<button class="btn" data-act="startWorkout">Start Workout</button>`:`<button class="btn" data-go="personalise" data-p='{"date":"${date}"}'>Plan this day</button>`}</div></div></div>`};
function fmtTime(t){let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${pad2(h)}:${pad2(m)} ${ap}`}
ACTS.fav=a=>{S.favorite=!S.favorite;a.classList.toggle('on',S.favorite);if(S.favorite){planFor(cur.params.date||TODAY).slice(0,2).forEach(id=>{if(!S.favDrills.includes(id))S.favDrills.unshift(id)})}save();toast(S.favorite?'Added to favorites':'Removed from favorites')};
ACTS.schedule=()=>openSheet(`<h3>Schedule Workout</h3><p class="muted">Ignis reminds you at this time and the mat pulses when it’s time to train.</p><form id="sf" class="stack"><label class="field">${ic('cal',18)}<input id="st" type="time" value="${S.schedule}"></label><button class="btn" type="submit">Save time</button></form>`,sh=>sh.querySelector('#sf').addEventListener('submit',e=>{e.preventDefault();S.schedule=sh.querySelector('#st').value||S.schedule;closeSheet(true);rerender();toast('Reminder set for '+fmtTime(S.schedule))}));
ACTS.difficulty=()=>openSheet(`<h3>Difficulity</h3><p class="muted">Sets how fast the mat lights the next cue.</p><div class="stack">${['Beginner','Intermediate','Advanced'].map(l=>`<button class="opt-row ${S.difficulty===l?'on':''}" data-act="diffSet" data-l="${l}"><span>${l}</span><small>${{Beginner:'1.6s',Intermediate:'1.1s',Advanced:'0.7s'}[l]} per cue</small></button>`).join('')}</div>`);
ACTS.diffSet=a=>{S.difficulty=a.dataset.l;closeSheet(true);rerender()};
ACTS.startWorkout=()=>{const date=cur.params.date||TODAY;if(!S.mat.connected){openSheet(`<h3>Start without the mat?</h3><p class="muted">Connect your Ignis mat to have each touch counted, or use the demo mat to watch a session run.</p><div class="stack"><button class="btn" data-act="matDemoStart">Use the demo mat</button><button class="opt-row" data-act="mat"><span>Connect a real mat</span>${ic('bt',18)}</button><button class="opt-row" data-act="tapStart"><span>Tap the mat on screen</span>${ic('right',16)}</button></div>`);return}
  go('live',{date,i:0})};
ACTS.matDemoStart=()=>{S.mat={connected:true,mode:'demo',name:'Ignis Mat (demo)'};closeSheet(true);go('live',{date:cur.params.date||TODAY,i:0})};
ACTS.tapStart=()=>{closeSheet(true);go('live',{date:cur.params.date||TODAY,i:0})};

/* ---------- drill detail ---------- */
SCREENS.drill=({id})=>{const d=D(id);const reps=S.reps[id]||30;return `<div class="flexcol">${top('',{close:true,two:true})}
 <div class="video" id="vid" style="margin-top:0"><img src="video.png" alt="">${matSVG('vmat',true)}<button class="vbtn" data-act="vplay" aria-label="Play the mat pattern"><span style="width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#1d2b63">${ic('play',14)}</span></button></div>
 <div class="pad" style="margin-top:50px"><h1 class="h-sec">${esc(d.name)}</h1><small class="muted">${d.level}</small>
  <h2 class="h-sec" style="margin-top:30px">Descriptions</h2><p style="font-size:12px;line-height:1.5;margin:15px 0 0;font-weight:500">${esc(d.desc)}</p>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><h2 class="h-sec">How To Do It</h2><small class="muted">${d.steps.length} Steps</small></div>
  <ol class="steps">${d.steps.map((s,k)=>`<li><span class="n">${pad2(k+1)}</span><span class="c"><i></i></span><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></li>`).join('')}</ol>
  <h2 class="h-sec" style="margin-top:14px">Custom Repetitions</h2>
  <div class="wheel-wrap"><div class="wheel" id="wheel" tabindex="0" aria-label="Repetitions"><div class="pad-y"></div>${Array.from({length:56},(_,k)=>k+5).map(n=>`<div class="opt" data-n="${n}"><span class="fl">${ic('flame',13)}</span>${Math.round(n*0.5)} kcal burn <b>${n}</b><span class="times">${''}</span></div>`).join('')}<div class="pad-y"></div></div></div>
 </div>
 <div class="cta"><button class="btn" data-act="repSave">Save</button></div></div>`};
AFTER.drill=(el,{id})=>{const w=el.querySelector('#wheel');const opts=[...w.querySelectorAll('.opt')];const start=S.reps[id]||30;
  const mark=()=>{const c=w.scrollTop+w.clientHeight/2;let best=opts[0],bd=1e9;opts.forEach(o=>{const m=o.offsetTop+o.offsetHeight/2;const dd=Math.abs(m-c);if(dd<bd){bd=dd;best=o}});
   opts.forEach(o=>{o.classList.toggle('on',o===best);o.querySelector('.times').textContent=o===best?'times':''});w.dataset.val=best.dataset.n};
  const t=opts.find(o=>+o.dataset.n===start);w.scrollTop=t.offsetTop-w.clientHeight/2+t.offsetHeight/2;mark();w.addEventListener('scroll',()=>requestAnimationFrame(mark));
  w.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();w.scrollBy({top:e.key==='ArrowDown'?46:-46,behavior:'smooth'})}});};
ACTS.repSave=()=>{const id=cur.params.id;const v=+document.getElementById('wheel').dataset.val;S.reps[id]=v;save();toast(`${D(id).name}: ${v} reps saved`);back()};
ACTS.vplay=a=>{const v=document.getElementById('vid');const playing=v.classList.toggle('playing');a.style.opacity=playing?0:1;const d=D(cur.params.id);const zs=[...v.querySelectorAll('.zone')];let k=0;
  if(playing){const t=setInterval(()=>{zs.forEach(z=>z.classList.remove('lit'));const z=v.querySelector(`.zone[data-z="${d.zones[k++%d.zones.length]}"]`);z&&z.classList.add('lit')},650);timers.push(t);v.dataset.t=t;
   v.onclick=()=>{clearInterval(+v.dataset.t);v.classList.remove('playing');a.style.opacity=1;v.onclick=null}}};

/* ---------- live session ---------- */
SCREENS.live=({date,i})=>{const l=planFor(date);const d=D(l[i]);return `<div class="live">
 <div class="top"><button class="navbtn" data-act="liveQuit" aria-label="End workout">${ic('x',16,1.8)}</button><h2>${i+1} of ${l.length}</h2><button class="navbtn" data-act="mat" aria-label="Mat status" style="color:${S.mat.connected?'#0aa3b5':'var(--grey)'}">${ic('mat',18)}</button></div>
 <div class="live-head"><small>${S.mat.connected?(S.mat.mode==='demo'?'Demo mat · auto touches':'Mat live'):'Tap the lit zone'}</small><h3>${esc(d.name)}</h3></div>
 <div class="matbox" id="mb">${matSVG('livemat')}<div class="mat-hint" id="hint">${S.mat.connected&&S.mat.mode!=='demo'?'Touch the ball to the lit zone':'React to the light: tap the zone that glows'}</div></div>
 <div class="live-stats"><div><b id="ls-t">${d.secs}</b><small>secs left</small></div><div><b id="ls-n">0</b><small>touches</small></div><div><b id="ls-r">–</b><small>avg reaction</small></div></div>
 <div class="timer-bar"><i id="tb" style="width:100%"></i></div>
 <div class="live-next"><span>Next: ${l[i+1]?esc(D(l[i+1]).name):'Finish'}</span><span>${S.difficulty}</span></div>
 <div class="cta" style="background:#fff"><div class="live-ctrl"><button class="sq-btn" data-act="livePause" aria-label="Pause">${ic('pause',20)}</button><button class="btn" data-act="liveSkip">${l[i+1]?'Next drill':'Finish workout'} ${ic('skip',16,1.8)}</button></div></div></div>`};
let LIVE=null;
AFTER.live=(el,{date,i})=>{const l=planFor(date);const d=D(l[i]);
  if(i===0||!LIVE)LIVE={date,touches:0,react:[],start:Date.now(),secs:0,drills:0};
  const zones=[...el.querySelectorAll('.zone')];let left=d.secs,paused=false,litZone=null,litAt=0,ci=0,auto=null;
  const cueGap={Beginner:1600,Intermediate:1100,Advanced:700}[S.difficulty];
  const tEl=el.querySelector('#ls-t'),nEl=el.querySelector('#ls-n'),rEl=el.querySelector('#ls-r'),tb=el.querySelector('#tb');
  const upd=()=>{nEl.textContent=LIVE.touches;if(LIVE.react.length){rEl.textContent=Math.round(LIVE.react.reduce((a,b)=>a+b,0)/LIVE.react.length)+'ms'}};
  const cue=()=>{if(paused)return;zones.forEach(z=>z.classList.remove('lit'));
    const pat=d.zones;const name=Math.random()<.25?['n','nw','ne','w','e','sw','se','loop'][Math.floor(Math.random()*8)]:pat[ci++%pat.length];
    litZone=el.querySelector(`.zone[data-z="${name}"]`);litZone.classList.add('lit');litAt=performance.now();
    if(S.mat.connected&&S.mat.mode==='demo'){clearTimeout(auto);auto=setTimeout(()=>hit(litZone),280+Math.random()*Math.min(900,cueGap*.6));timers.push(auto)}};
  const hit=z=>{if(paused||!litZone)return;if(z!==litZone){z.classList.add('hit');setTimeout(()=>z.classList.remove('hit'),150);return}
    const rt=Math.round(performance.now()-litAt);LIVE.react.push(rt);LIVE.touches++;z.classList.remove('lit');z.classList.add('hit');litZone=null;upd();
    if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
    setTimeout(()=>z.classList.remove('hit'),180);const t=setTimeout(cue,Math.max(250,cueGap-rt*.3));timers.push(t)};
  zones.forEach(z=>z.addEventListener('pointerdown',()=>hit(z)));
  const miss=setInterval(()=>{if(!paused&&litZone&&performance.now()-litAt>cueGap*2.2){litZone.classList.remove('lit');litZone=null;cue()}},300);timers.push(miss);
  const tick=setInterval(()=>{if(paused)return;left--;LIVE.secs++;tEl.textContent=Math.max(0,left);tb.style.width=(left/d.secs*100)+'%';if(left<=0){next()}},1000);timers.push(tick);
  const t0=setTimeout(cue,600);timers.push(t0);
  function next(){clearTimers();markDone(date,l[i]);LIVE.drills++;if(i+1<l.length)go('live',{date,i:i+1},{replace:true});else finish()}
  ACTS.liveSkip=()=>next();
  ACTS.livePause=a=>{paused=!paused;a.innerHTML=ic(paused?'playO':'pause',20);el.querySelector('#hint').textContent=paused?'Paused':'React to the light: tap the zone that glows';if(paused){zones.forEach(z=>z.classList.remove('lit'));litZone=null}else cue()};
  ACTS.liveQuit=()=>openSheet(`<h3>End workout?</h3><p class="muted">Drills you finished so far will be saved.</p><div class="stack"><button class="btn" data-act="liveEnd">End and save</button><button class="opt-row" data-act="closeSheet"><span>Keep going</span></button></div>`);
  ACTS.liveEnd=()=>{closeSheet(true);clearTimers();if(LIVE.drills)finish();else{LIVE=null;go('home',{},{reset:true,back:true})}};
};
function markDone(date,id){S.done[date]=S.done[date]||[];if(!S.done[date].includes(id))S.done[date].push(id)}
function finish(){const m=Math.max(1,Math.round(LIVE.secs/60));const avg=LIVE.react.length?Math.round(LIVE.react.reduce((a,b)=>a+b,0)/LIVE.react.length):0;
  S.history.push({date:LIVE.date,minutes:m,drills:LIVE.drills,kcal:Math.round(m*8+LIVE.touches*0.4),reaction:avg,touches:LIVE.touches});
  S.notif.unshift({id:Date.now(),t:'Congratulations, you have completed your drill',s:'Just now',img:'av-n3.png',read:false});
  const res={...LIVE,avg,m};LIVE=null;save();go('congrats',res,{reset:true})}

SCREENS.congrats=(r)=>`<div class="flexcol"><div class="top" style="justify-content:flex-start"><button class="navbtn" data-go="home" aria-label="Back to home">${ic('left',16,1.8)}</button></div>
 <img class="illus" src="congrats.png" alt="" style="width:313px;margin-top:4px">
 <div class="pad" style="text-align:center;margin-top:22px"><h1 class="h-title" style="color:var(--title);line-height:1.5">Congratulations, You Have Completed All Your Drills</h1>
 ${r&&r.drills?`<div class="stats" style="margin:16px 0 0"><div><b>${r.drills}</b><small>drills</small></div><div><b>${r.touches}</b><small>touches</small></div><div><b>${r.avg?r.avg+'ms':'–'}</b><small>reaction</small></div></div>`:''}
 <p class="muted" style="margin:18px auto 0;max-width:270px">“Every day is an opportunity disguised as a challenge.”<br>Tiki Barber</p></div>
 <div class="cta"><button class="btn" style="background:#132158" data-go="home">Back To Home</button></div></div>`;

/* ---------- history ---------- */
SCREENS.history=({date})=>{const h=S.history.filter(x=>x.date===date);const d=new Date(date+'T12:00');const sum=histDay(date);
 return `<div class="flexcol">${top(WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()].slice(0,3))}
 <div class="stats" style="margin-top:30px"><div><b>${sum.minutes}m</b><small>trained</small></div><div><b>${sum.kcal}</b><small>kcal</small></div><div><b>${sum.reaction||'–'}${sum.reaction?'ms':''}</b><small>reaction</small></div></div>
 <div class="pad" style="margin-top:30px"><h2 class="h-sec">Drills</h2>${(planFor(date).length?planFor(date):GOALS[S.goal].drills).map(id=>`<button class="ex" data-go="drill" data-p='{"id":"${id}"}'><span class="tile">${ic('bolt',20,1.4)}</span><span class="meta"><b>${esc(D(id).name)}</b><small>${D(id).secs} secs</small></span><span class="go">${ic('right',18)}</span></button>`).join('')}
 ${h.some(x=>x.example)?'<p class="example" style="text-align:left">Example session</p>':''}</div>
 <div class="cta"><button class="btn" data-go="workout" data-p='{"date":"${TODAY}"}'>Train today</button></div></div>`};

/* ================= boot ================= */
go(S.stage==='app'?'home':S.stage==='auth'?'register':'welcome',{},{reset:true});
})();
</script>
</body>
</html>
